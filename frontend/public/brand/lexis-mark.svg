<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="lexis-amber-beam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff7a17" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#ffc285" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff7a17" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lexis-facet-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc285"/>
      <stop offset="100%" stop-color="#ff7a17"/>
    </linearGradient>
    <linearGradient id="facet-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dadbdf"/>
    </linearGradient>
    <linearGradient id="facet-base" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>
  </defs>

  <!-- Refraction Beam from focal core out toward right edge -->
  <polygon points="50,54 98,38 98,66" fill="url(#lexis-amber-beam)"/>

  <!-- Facet 1: Left Ascent Plane (Titanium White) -->
  <polygon points="50,14 16,80 50,54" fill="url(#facet-left)"/>

  <!-- Facet 2: Base Horizon Plane (Graphite Shadow) -->
  <polygon points="16,80 84,80 50,54" fill="url(#facet-base)"/>

  <!-- Facet 3: Right Refractive Aperture Plane (Sunset Amber) -->
  <polygon points="50,14 50,54 84,80" fill="url(#lexis-facet-amber)"/>

  <!-- Chiseled Edge Hairlines -->
  <line x1="50" y1="14" x2="50" y2="54" stroke="#0a0a0a" stroke-width="2"/>
  <line x1="16" y1="80" x2="50" y2="54" stroke="#0a0a0a" stroke-width="2"/>
  <line x1="84" y1="80" x2="50" y2="54" stroke="#0a0a0a" stroke-width="2"/>

  <!-- Central Aperture Focal Point (Sunset Amber) -->
  <circle cx="50" cy="54" r="4.2" fill="#ff7a17"/>
</svg>
