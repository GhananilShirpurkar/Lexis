<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="fav-beam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff7a17" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#ffc285" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff7a17" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fav-facet-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc285"/>
      <stop offset="100%" stop-color="#ff7a17"/>
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="100" height="100" rx="22" fill="#0a0a0a"/>
  <!-- Refraction beam -->
  <polygon points="50,54 94,40 94,64" fill="url(#fav-beam)"/>
  <!-- Facet 1 (Left - Titanium White) -->
  <polygon points="50,16 20,78 50,54" fill="#ffffff"/>
  <!-- Facet 2 (Base - Graphite) -->
  <polygon points="20,78 80,78 50,54" fill="#52525b"/>
  <!-- Facet 3 (Right - Sunset Amber) -->
  <polygon points="50,16 50,54 80,78" fill="url(#fav-facet-amber)"/>
  <!-- Hairline dividers -->
  <line x1="50" y1="16" x2="50" y2="54" stroke="#0a0a0a" stroke-width="2.5"/>
  <line x1="20" y1="78" x2="50" y2="54" stroke="#0a0a0a" stroke-width="2.5"/>
  <line x1="80" y1="78" x2="50" y2="54" stroke="#0a0a0a" stroke-width="2.5"/>
  <!-- Focal core dot -->
  <circle cx="50" cy="54" r="4.5" fill="#ff7a17"/>
</svg>
